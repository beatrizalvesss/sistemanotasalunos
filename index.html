<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Sistema de Notas dos Alunos</h1>
    <p>Digite as notas do aluno e clique em calcular.</p>

    <form>
        <label>Nota 1:</label><br>
        <input type="number" id="nota1"><br><br>

        <label>Nota 2:</label><br>
        <input type="number" id="nota2"><br><br>

        <label>Nota 3:</label><br>
        <input type="number" id="nota3"><br><br>

        <button type="button" onclick="calcularMedia()">Calcular Média</button>
    </form>

    <h2>Resultado</h2>
    <p id="resultado">A média do aluno aparecerá aqui.</p>
</div>

<script>
function calcularMedia() {
    let n1 = parseFloat(document.getElementById("nota1").value);
    let n2 = parseFloat(document.getElementById("nota2").value);
    let n3 = parseFloat(document.getElementById("nota3").value);

    if (isNaN(n1) || isNaN(n2) || isNaN(n3)) {
        document.getElementById("resultado").innerText =
            "⚠️ Preencha todas as notas corretamente.";
        return;
    }

    let media = (n1 + n2 + n3) / 3;
    let situacao = media >= 6 ? "Aprovado ✅" : "Reprovado ❌";

    let resultado = document.getElementById("resultado");

    resultado.innerText =
        `Média: ${media.toFixed(2)} — Situação: ${situacao}`;

    if (media >= 6) {
        resultado.style.color = "green";
    } else {
        resultado.style.color = "red";
    }
}
</script>

</body>
</html>
